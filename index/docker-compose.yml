services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: opensensemap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    command:
      - postgres
      - -c
      - timezone=Europe/Berlin
      - -c
      - log_timezone=Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./postgrest_roles.sql:/docker-entrypoint-initdb.d/02_postgrest_roles.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: opensensemap_postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://${POSTGREST_DB_USER}:${POSTGREST_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: ${POSTGREST_DB_SCHEMA:-public}
      PGRST_DB_ANON_ROLE: ${POSTGREST_ANON_ROLE:-web_anon}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${POSTGREST_PORT:-3001}
    ports:
      - "${POSTGREST_PORT:-3001}:3000"

  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile.pgadmin
    container_name: opensensemap_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5051}:80"

volumes:
  postgres_data:
    name: opensensemap_postgres_data
    driver: local
  pgadmin_data:
    name: opensensemap_pgadmin_data
    driver: local
