version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: opensensemap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_indexer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ARCHIVE_BASE_URL: ${ARCHIVE_BASE_URL}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
      GEOCODE_DELAY_SECONDS: ${GEOCODE_DELAY_SECONDS}
    volumes:
      - ./logs:/app/logs
    command: ["python", "indexer.py", "--mode", "scheduler"]

volumes:
  postgres_data:
    driver: local
