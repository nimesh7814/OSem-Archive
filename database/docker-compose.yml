services:
  db:
    image: timescale/timescaledb-ha:pg16-ts2.26
    container_name: osem_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SHARED_PRELOAD_LIBRARIES: "timescaledb,pg_cron"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: osem_postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: >-
        postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_OPENAPI_MODE: "follow-privileges"
      PGRST_DB_POOL: "10"
      PGRST_DB_POOL_TIMEOUT: "10"
    ports:
      - "${POSTGREST_PORT:-3000}:3000"

  pgadmin:
    image: dpage/pgadmin4
    container_name: osem_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro

  # One-shot initializer: waits for the `db` service to become healthy
  # then applies the `annon_role.sql` script to create the `web_anon` role.
  # This runs once when `docker compose up -d` is executed.
  db-init:
    image: postgres:16
    container_name: osem_db_init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./annon_role.sql:/sql/annon_role.sql:ro
    command: >
      sh -c "until pg_isready -h db -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 1; done; \
             psql -h db -U $POSTGRES_USER -d $POSTGRES_DB -f /sql/annon_role.sql || true"

volumes:
  db_data:
  pgadmin_data:
