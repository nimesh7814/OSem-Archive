services:

  # -----------------------------------------------------------
  # Volume permission initializer
  # Required for timescaledb-ha on Windows/Docker Desktop
  # Runs once, sets correct ownership (UID 1000) on the volume
  # -----------------------------------------------------------
  db-init:
    image: alpine:latest
    container_name: osem_db_init
    restart: "no"
    volumes:
      - postgres_data:/pgdata
    command: sh -c "chown -R 1000:1000 /pgdata && chmod -R 700 /pgdata"

  # -----------------------------------------------------------
  # TimescaleDB HA (PostgreSQL 16 + TimescaleDB + PostGIS)
  # -----------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: osem_timescaledb
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGDATA:            /pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/pgdata                               # named volume (permissions fixed by db-init)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql     # runs on first ever start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------
  # pgAdmin
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: osem_pgadmin
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin                      # named volume
      - ./servers.json:/pgadmin4/servers.json:ro            # auto-register DB server

volumes:
  postgres_data:
  pgadmin_data:
