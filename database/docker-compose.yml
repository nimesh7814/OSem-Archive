services:

  # -----------------------------------------------------------
  # Volume permission initializer
  # Required for timescaledb-ha on Windows/Docker Desktop
  # Runs once, sets correct ownership (UID 1000) on the volume
  # -----------------------------------------------------------
  db-init:
    image: alpine:latest
    container_name: osem_db_init
    restart: "no"
    volumes:
      - postgres_data:/pgdata
    command: sh -c "chown -R 1000:1000 /pgdata && chmod -R 700 /pgdata"

  # -----------------------------------------------------------
  # TimescaleDB HA (PostgreSQL 16 + TimescaleDB + PostGIS)
  # -----------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: osem_timescaledb
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGDATA:            /pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/pgdata                                 # named volume (permissions fixed by db-init)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------
  # pgAdmin
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: osem_pgadmin
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin                        # named volume
      - ./servers.json:/pgadmin4/servers.json:ro              # auto-register DB server

volumes:
  # -----------------------------------------------------------
  # Named volumes with explicit fixed names.
  # Docker Compose creates them automatically on first
  # `docker compose up -d` if they do not already exist.
  #
  # Data is preserved when containers are stopped or removed:
  #   docker compose down            ✅ volumes kept
  #   docker compose down --volumes  ❌ volumes destroyed — avoid!
  #   docker rm osem_timescaledb     ✅ volumes kept
  #
  # To wipe data intentionally:
  #   docker volume rm osem_postgres_data osem_pgadmin_data
  # -----------------------------------------------------------
  postgres_data:
    name: osem_postgres_data    # fixed name — survives container removal & re-creation
    driver: local
  pgadmin_data:
    name: osem_pgadmin_data     # fixed name — survives container removal & re-creation
    driver: local
