services:

  # ---------------------------------------------------------------------------
  # TimescaleDB  (PostgreSQL 16 + TimescaleDB + PostGIS bundled)
  # Schema is applied automatically on first start via initdb.d
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: opensensemap_db
    restart: unless-stopped
    mem_limit: 4g
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
      # Passed through so 02_readonly_role.sh can create the role with the
      # correct credentials on first initialisation.
      DB_RO_USER:        ${DB_RO_USER:-web_anonymous}
      DB_RO_PASSWORD:    ${DB_RO_PASSWORD:-osem_readonly}
      # Required for pg_cron — enables the daily auto_adjust_readings() job
      # that keeps chunk interval and aggregates in sync with recorded_at range.
      POSTGRES_SHARED_PRELOAD_LIBRARIES: 'timescaledb,pg_cron'
      POSTGRES_CRON_DATABASE: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 01: core schema — stations, sensors, readings, continuous aggregates
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # 02: read-only role for the API
      - ./02_readonly_role.sh:/docker-entrypoint-initdb.d/02_readonly_role.sh:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Schema migrator — reapplies schema.sql on every compose up so existing
  # volumes are repaired automatically when app tables are missing.
  # ---------------------------------------------------------------------------
  schema-migrator:
    image: timescale/timescaledb-ha:pg16
    container_name: opensensemap_schema_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: ["bash", "-lc", "psql -h db -v ON_ERROR_STOP=1 -U ${DB_USER} -d ${DB_NAME} -f /schema.sql"]
    volumes:
      - ./schema.sql:/schema.sql:ro

  # ---------------------------------------------------------------------------
  # Boundaries loader — one-shot service that imports admin_boundary.geojson
  # into the `boundaries` table on first run, then exits and never runs again.
  #
  # Behaviour:
  #   • If boundaries table already has rows → prints "already loaded" and exits
  #   • If table is empty                   → loads all GeoJSON rows, then exits
  #
  # First run:  docker compose up -d boundaries-loader
  # Force re-load (e.g. after replacing the GeoJSON):
  #   docker compose run --rm boundaries-loader python load_boundaries.py \
  #     --geojson /data/admin_boundary.geojson \
  #     --dsn postgresql://<user>:<pass>@db:5432/<db>
  # ---------------------------------------------------------------------------
  boundaries-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_boundaries_loader
    restart: "no"
    mem_limit: 512m
    command: [
      "python", "load_boundaries.py",
      "--geojson", "/data/admin_boundary.geojson",
      "--dsn", "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
    ]
    volumes:
      - ./data/admin_boundary.geojson:/data/admin_boundary.geojson:ro
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Scraper — downloads the OpenSenseMap archive and writes to TimescaleDB.
  #
  # Start:   docker compose up -d scraper
  # Stop:    docker compose stop scraper          (sends SIGTERM → clean exit)
  # Restart: docker compose start scraper         (resumes from last checkpoint)
  # Logs:    docker compose logs -f scraper
  #
  # The named volume "scraper_data" persists progress.json across restarts so
  # the scraper always resumes from the last fully-committed date.
  # ---------------------------------------------------------------------------
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_scraper
    restart: "no"          # do NOT auto-restart — operator decides when to run
    stop_grace_period: 2m  # give the scraper time to finish the current station
    mem_limit: 1g
    environment:
      DB_HOST:         db
      DB_PORT:         5432
      DB_NAME:         ${DB_NAME}
      DB_USER:         ${DB_USER}
      DB_PASSWORD:     ${DB_PASSWORD}
      PROGRESS_FILE:   /data/progress.json
      DELAY_MIN:       ${DELAY_MIN:-0.1}
      DELAY_MAX:       ${DELAY_MAX:-0.4}
      DELAY_PER_DATE:  ${DELAY_PER_DATE:-0.5}
      DELAY_429_BASE:  ${DELAY_429_BASE:-60}
      MAX_429_RETRIES: ${MAX_429_RETRIES:-5}
    volumes:
      - scraper_data:/data
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Monitor — scraper progress dashboard
  # Open: http://localhost:${MONITOR_PORT:-5051}
  # Shows live date/station/sensor progress bars, KPI counters, and tables.
  # Reads progress.json from the shared scraper_data volume + queries the DB.
  # ---------------------------------------------------------------------------
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_monitor
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-u", "monitor.py"]
    environment:
      DB_HOST:       db
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME}
      DB_USER:       ${DB_USER}
      DB_PASSWORD:   ${DB_PASSWORD}
      PROGRESS_FILE: /data/progress.json
    volumes:
      - scraper_data:/data:ro   # read-only — monitor never writes progress
    ports:
      - "${MONITOR_PORT:-5051}:5051"
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # API — read-only spatial REST API
  # Open: http://localhost:${API_PORT:-5052}
  # All endpoints are anonymous GET requests, no authentication required.
  # Supports GeoJSON / Shapefile / CSV download.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_api
    restart: unless-stopped
    mem_limit: 256m
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "5052"]
    environment:
      DB_HOST:        db
      DB_PORT:        5432
      DB_NAME:        ${DB_NAME}
      DB_RO_USER:     ${DB_RO_USER:-web_anonymous}
      DB_RO_PASSWORD: ${DB_RO_PASSWORD:-osem_readonly}
    ports:
      - "${API_PORT:-5052}:5052"
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — web UI for the database
  # Open: http://localhost:${PGADMIN_PORT:-5050}
  # The OpenSenseMap DB server is pre-configured (no manual setup needed).
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opensensemap_pgadmin
    restart: unless-stopped
    mem_limit: 512m
    entrypoint: ["/bin/sh", "/pgadmin4/pgadmin_init.sh"]
    environment:
      DB_HOST:                             db
      DB_PORT:                             5432
      DB_NAME:                             ${DB_NAME}
      DB_USER:                             ${DB_USER}
      DB_PASSWORD:                         ${DB_PASSWORD}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP:  "True"
      PGADMIN_DEFAULT_EMAIL:               ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD:            ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE:          "False"   # desktop mode — no login screen
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin_init.sh:/pgadmin4/pgadmin_init.sh:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Geo-resolver — resolves region_code FK on stations via ST_Within against
  # the boundaries table. Runs every 30 minutes, first run after 30 min delay.
  #
  # Progress and stats are written to the shared scraper_data volume at:
  #   /data/geo_resolver_progress.json
  #
  # Logs:  docker compose logs -f geo-resolver
  # Tune timing via RESOLVE_INTERVAL / GEO_INITIAL_DELAY (seconds).
  # ---------------------------------------------------------------------------
  geo-resolver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_geo_resolver
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-u", "geo_resolver.py"]
    environment:
      DB_HOST:          db
      DB_PORT:          5432
      DB_NAME:          ${DB_NAME}
      DB_USER:          ${DB_USER}
      DB_PASSWORD:      ${DB_PASSWORD}
      PROGRESS_FILE:    /data/geo_resolver_progress.json
      RESOLVE_INTERVAL: ${RESOLVE_INTERVAL:-1800}
      INITIAL_DELAY:    ${GEO_INITIAL_DELAY:-1800}
      BATCH_SIZE:       ${GEO_BATCH_SIZE:-500}
    volumes:
      - scraper_data:/data
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Sensor classifier — fills the sensors.type column by matching sensor_info
  # and unit against a rule table. Runs every 30 minutes (first run after 60s).
  # Only touches rows where type IS NULL — never overwrites existing values.
  #
  # Progress is written to /data/sensor_classifier_progress.json
  #
  # Logs:  docker compose logs -f sensor-classifier
  # Force re-classify "Unknown" rows after adding new rules:
  #   docker compose run --rm -e OVERWRITE_UNKNOWN=1 sensor-classifier
  # ---------------------------------------------------------------------------
  sensor-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opensensemap_sensor_classifier
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-u", "sensor_classifier.py"]
    environment:
      DB_HOST:           db
      DB_PORT:           5432
      DB_NAME:           ${DB_NAME}
      DB_USER:           ${DB_USER}
      DB_PASSWORD:       ${DB_PASSWORD}
      PROGRESS_FILE:     /data/sensor_classifier_progress.json
      CLASSIFY_INTERVAL: ${CLASSIFY_INTERVAL:-1800}
      INITIAL_DELAY:     ${CLASSIFIER_INITIAL_DELAY:-60}
      BATCH_SIZE:        ${CLASSIFIER_BATCH_SIZE:-500}
      OVERWRITE_UNKNOWN: ${OVERWRITE_UNKNOWN:-0}
    volumes:
      - scraper_data:/data
    depends_on:
      db:
        condition: service_healthy
      schema-migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
    external: true
    name: archiveportal_postgres_data
  scraper_data:
    external: true
    name: archiveportal_scraper_data
  pgadmin_data:
    external: true
    name: archiveportal_pgadmin_data
