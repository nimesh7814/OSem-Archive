server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Re-resolve the api hostname on every request (via Docker's embedded
    # DNS) instead of caching its IP for the worker's lifetime - otherwise
    # rebuilding/recreating the api container leaves nginx pointing at a
    # dead IP until wrk_front itself is restarted.
    resolver 127.0.0.11 valid=10s;
    set $upstream_api http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
  }

  location = /robots.txt {
    access_log off;
    log_not_found off;
  }
}
