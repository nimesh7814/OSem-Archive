# docker-compose.yml
# openSenseMap Archive — database services

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: database
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./backend/db/migrations/00001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./backend/db/migrations/00002_regions.sql:/docker-entrypoint-initdb.d/02_regions.sql:ro
      - ./backend/data/admin_boundary.geojson:/docker-entrypoint-initdb.d/admin_boundary.geojson:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backend/db/servers.json:/pgadmin4/servers.json:ro
      - ./backend/db/pgpass:/pgpass:ro

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingest
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
    command: ["python", "ingest/load_archive.py"]
    restart: "no"

volumes:
  timescale_data:
  pgadmin_data:
