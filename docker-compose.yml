# docker-compose.yml
# openSenseMap Archive — database services

networks:
  osem_network:
    name: osem_network

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: timescaledb
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    command:
      - -cshared_preload_libraries=timescaledb,pg_cron
      - -ccron.database_name=${POSTGRES_DB:-osem_archive}
    ports:
      - "5433:5432"
    networks:
      - osem_network
    volumes:
      - timescale_data:/home/postgres/pgdata
      - ./backend/db/migrations/00001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./backend/db/migrations/00002_regions.sql:/docker-entrypoint-initdb.d/02_regions.sql:ro
      - ./backend/db/migrations/00003_aggregated.sql:/docker-entrypoint-initdb.d/03_aggregated.sql:ro
      - ./backend/db/migrations/00004_export_job.sql:/docker-entrypoint-initdb.d/04_export_job.sql:ro
      - ./backend/db/migrations/00005_measurements_sensor_time_index.sql:/docker-entrypoint-initdb.d/05_measurements_sensor_time_index.sql:ro
      - ./backend/db/migrations/00006_export_filter_indexes.sql:/docker-entrypoint-initdb.d/06_export_filter_indexes.sql:ro
      - ./backend/db/migrations/00007_sensors_last_measurement.sql:/docker-entrypoint-initdb.d/07_sensors_last_measurement.sql:ro
      - ./backend/db/migrations/00008_export_job_expiry.sql:/docker-entrypoint-initdb.d/08_export_job_expiry.sql:ro
      - ./backend/data/admin_boundary.geojson:/docker-entrypoint-initdb.d/admin_boundary.geojson:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5151:80"
    networks:
      - osem_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backend/db/servers.json:/pgadmin4/servers.json:ro
      - ./backend/db/pgpass:/pgpass:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - osem_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - osem_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    env_file:
      - ./backend/.env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - osem_network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${MINIO_BUCKET} &&
      mc anonymous set none local/$${MINIO_BUCKET} &&
      exit 0
      "

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_FILE: /app/logs/api.log
      PYTHONPATH: /app
    working_dir: /app
    command: celery -A api.app.tasks:celery_app worker --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - osem_network
    volumes:
      - ./backend:/app
      - api_logs:/app/logs

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingest
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      PYTHONPATH: /app
    working_dir: /app
    networks:
      - osem_network
    volumes:
      - ./backend:/app
    command: ["python", "ingest/load_archive.py"]
    restart: "no"

  ingest-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingest_scheduler
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      PYTHONPATH: /app
      INGEST_SCHEDULE_TIME: ${INGEST_SCHEDULE_TIME:-00:00}
      INGEST_SCHEDULE_TIMEZONE: ${INGEST_SCHEDULE_TIMEZONE:-Europe/Berlin}
      INGEST_SCHEDULER_RUN_ON_START: ${INGEST_SCHEDULER_RUN_ON_START:-false}
    working_dir: /app
    networks:
      - osem_network
    volumes:
      - ./backend:/app
    command: ["python", "ingest/scheduler.py"]
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      EXPORT_DIR: /app/jobs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_FILE: /app/logs/api.log
      PYTHONPATH: /app
    working_dir: /app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    networks:
      - osem_network
    volumes:
      - ./backend:/app
      - export_jobs:/app/jobs
      - api_logs:/app/logs
    restart: unless-stopped

  osem_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-osem}:${POSTGRES_PASSWORD:-osem_db_lock}@timescaledb:5432/${POSTGRES_DB:-osem_archive}"
      OSEM_API_URL: "https://api.opensensemap.org/"
    ports:
      - "3010:3000"
    networks:
      - osem_network
    restart: unless-stopped

volumes:
  timescale_data:
  pgadmin_data:
  redis_data:
  minio_data:
  export_jobs:
  api_logs:
