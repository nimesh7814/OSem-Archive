# docker-compose.yml
# openSenseMap Archive — database services

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: osem_timescaledb
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    command:
      - -cshared_preload_libraries=timescaledb,pg_cron
      - -ccron.database_name=osem_archive
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata
      - ./backend/db/migrations/00001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./backend/db/migrations/00002_regions.sql:/docker-entrypoint-initdb.d/02_regions.sql:ro
      - ./backend/db/migrations/00003_aggregated.sql:/docker-entrypoint-initdb.d/03_aggregated.sql:ro
      - ./backend/db/migrations/00004_export_job.sql:/docker-entrypoint-initdb.d/04_export_job.sql:ro
      - ./backend/db/migrations/00005_measurements_sensor_time_index.sql:/docker-entrypoint-initdb.d/05_measurements_sensor_time_index.sql:ro
      - ./backend/db/migrations/00006_export_filter_indexes.sql:/docker-entrypoint-initdb.d/06_export_filter_indexes.sql:ro
      - ./backend/db/migrations/00007_sensors_last_measurement.sql:/docker-entrypoint-initdb.d/07_sensors_last_measurement.sql:ro
      - ./backend/db/migrations/00008_export_job_expiry.sql:/docker-entrypoint-initdb.d/08_export_job_expiry.sql:ro
      - ./backend/data/admin_boundary.geojson:/docker-entrypoint-initdb.d/admin_boundary.geojson:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: osem_pgadmin
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backend/db/servers.json:/pgadmin4/servers.json:ro
      - ./backend/db/pgpass:/pgpass:ro

  redis:
    image: redis:7-alpine
    container_name: osem_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osem_ingest
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
    command: ["python", "ingest/load_archive.py"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osem_api
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      EXPORT_DIR: /app/jobs
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8001:8000"
    volumes:
      - export_jobs:/app/jobs
    restart: unless-stopped

  export_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osem_worker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      EXPORT_DIR: /app/jobs
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # Must match how api/main.py imports the module (`from functions.export
    # import ...`) -- api.main's PYTHONPATH makes "functions" resolve as a
    # package under api/, so the module's identity (and therefore the task's
    # registered name) is "functions.export", not bare "export". Pointing
    # celery at the wrong identity silently creates a second copy of the
    # same module under a different name, so the worker registers the task
    # as "export.run_export_job" while the API enqueues
    # "functions.export.run_export_job" -- the worker never recognizes it.
    command:
      [
        "celery",
        "-A",
        "functions.export.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=4",
      ]
    volumes:
      - export_jobs:/app/jobs
    restart: unless-stopped

  osem_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osem_frontend
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://osem:osem_db_lock@timescaledb:5432/osem_archive"
      OSEM_API_URL: "https://api.opensensemap.org/"
    ports:
      - "3010:3000"
    restart: unless-stopped

volumes:
  timescale_data:
  pgadmin_data:
  redis_data:
  export_jobs:
