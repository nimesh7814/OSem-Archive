# docker-compose.yml
# openSenseMap Archive — database services

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: database
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Europe/Berlin
      PGTZ: Europe/Berlin
    command:
      - -cshared_preload_libraries=timescaledb,pg_cron
      - -ccron.database_name=osem_archive
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata
      - ./backend/db/migrations/00001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./backend/db/migrations/00002_regions.sql:/docker-entrypoint-initdb.d/02_regions.sql:ro
      - ./backend/db/migrations/00003_aggregated.sql:/docker-entrypoint-initdb.d/03_aggregated.sql:ro
      - ./backend/data/admin_boundary.geojson:/docker-entrypoint-initdb.d/admin_boundary.geojson:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backend/db/servers.json:/pgadmin4/servers.json:ro
      - ./backend/db/pgpass:/pgpass:ro

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingest
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
    command: ["python", "ingest/load_archive.py"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      EXPORT_DIR: /app/jobs
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8001:8000"
    volumes:
      - export_jobs:/app/jobs
    restart: unless-stopped

  export_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: export_worker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      EXPORT_DIR: /app/jobs
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      [
        "celery",
        "-A",
        "api.functions.exports.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=4",
      ]
    volumes:
      - export_jobs:/app/jobs
    restart: unless-stopped

  wrk_front:
    build:
      context: ./wrk_front
      args:
        VITE_API_BASE_URL: /api
    container_name: wrk_front
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  timescale_data:
  pgadmin_data:
  export_jobs:
